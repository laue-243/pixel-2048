<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel 2048</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 4px solid #555; image-rendering: pixelated; background: #bbada0; }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const grid = 4;
const size = 100;
let board = Array(grid).fill().map(() => Array(grid).fill(0));
let score = 0;

function addTile() {
  const empty = [];
  for (let y=0; y<grid; y++) for (let x=0; x<grid; x++) if (board[y][x]===0) empty.push({x,y});
  if (empty.length === 0) return false;
  const pos = empty[Math.floor(Math.random()*empty.length)];
  board[pos.y][pos.x] = Math.random() < 0.9 ? 2 : 4;
  return true;
}

function draw() {
  ctx.fillStyle = '#bbada0';
  ctx.fillRect(0,0,400,400);
  for (let y=0; y<grid; y++) {
    for (let x=0; x<grid; x++) {
      const val = board[y][x];
      const px = x*size + 5, py = y*size + 5;
      ctx.fillStyle = val ? `hsl(${(Math.log2(val)*40)%360}, 60%, 50%)` : '#cdc1b4';
      ctx.fillRect(px, py, 90, 90);
      if (val) {
        ctx.fillStyle = '#fff';
        ctx.font = '30px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(val, px+45, py+45);
      }
    }
  }
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('Score: ' + score, 10, 390);
}

function slide(row) {
  let arr = row.filter(v => v);
  for (let i=0; i<arr.length-1; i++) {
    if (arr[i] === arr[i+1]) {
      arr[i] *= 2;
      score += arr[i];
      arr.splice(i+1, 1);
    }
  }
  while (arr.length < grid) arr.push(0);
  return arr;
}

function move(dir) {
  let moved = false;
  if (dir === 'left') {
    for (let y=0; y<grid; y++) {
      const newRow = slide(board[y]);
      if (newRow.some((v,i) => v !== board[y][i])) moved = true;
      board[y] = newRow;
    }
  } else if (dir === 'right') {
    for (let y=0; y<grid; y++) {
      const newRow = slide(board[y].slice().reverse()).reverse();
      if (newRow.some((v,i) => v !== board[y][i])) moved = true;
      board[y] = newRow;
    }
  } else if (dir === 'up') {
    for (let x=0; x<grid; x++) {
      let col = [];
      for (let y=0; y<grid; y++) col.push(board[y][x]);
      const newCol = slide(col);
      if (newCol.some((v,i) => v !== col[i])) moved = true;
      for (let y=0; y<grid; y++) board[y][x] = newCol[y];
    }
  } else if (dir === 'down') {
    for (let x=0; x<grid; x++) {
      let col = [];
      for (let y=0; y<grid; y++) col.push(board[y][x]);
      const newCol = slide(col.slice().reverse()).reverse();
      if (newCol.some((v,i) => v !== col[i])) moved = true;
      for (let y=0; y<grid; y++) board[y][x] = newCol[y];
    }
  }
  if (moved) {
    addTile();
    draw();
    if (!canMove()) alert('Game Over! Score: ' + score);
  }
}

function canMove() {
  for (let y=0; y<grid; y++) for (let x=0; x<grid; x++) {
    if (board[y][x] === 0) return true;
    if (x < grid-1 && board[y][x] === board[y][x+1]) return true;
    if (y < grid-1 && board[y][x] === board[y+1][x]) return true;
  }
  return false;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') move('left');
  if (e.key === 'ArrowRight') move('right');
  if (e.key === 'ArrowUp') move('up');
  if (e.key === 'ArrowDown') move('down');
});

addTile();
addTile();
draw();
</script>
</body>
</html>
