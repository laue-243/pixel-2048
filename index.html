<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel 2048 — Improved</title>
<style>
body { background: #1a1a2e; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; font-family: monospace; }
canvas { border: 8px solid #bbada0; image-rendering: pixelated; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="game" width="440" height="500"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const grid = 4, size = 100;
let board, score, best, state;

const colors = {
  0: '#cdc1b4',
  2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563',
  32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61',
  512: '#edc850', 1024: '#edc53f', 2048: '#edc22e'
};

function init() {
  board = Array(grid).fill().map(() => Array(grid).fill(0));
  score = 0;
  best = parseInt(localStorage.getItem('2048best')||'0');
  state = 'play';
  addTile();
  addTile();
}

function addTile() {
  const empty = [];
  for (let y=0; y<grid; y++) for (let x=0; x<grid; x++) if (!board[y][x]) empty.push({x,y});
  if (!empty.length) return false;
  const p = empty[Math.floor(Math.random()*empty.length)];
  board[p.y][p.x] = Math.random()<0.9 ? 2 : 4;
  return true;
}

function draw() {
  ctx.fillStyle = '#bbada0';
  ctx.fillRect(0,0,440,500);
  ctx.fillStyle = '#776e65';
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('2048', 220, 40);
  ctx.font = '16px monospace';
  ctx.fillText('Score: '+score+'   Best: '+best, 220, 65);

  for (let y=0; y<grid; y++) {
    for (let x=0; x<grid; x++) {
      const val = board[y][x];
      const px = x*size + 20, py = y*size + 90;
      ctx.fillStyle = colors[val] || '#3c3a32';
      ctx.fillRect(px, py, 90, 90);
      if (val) {
        ctx.fillStyle = val <= 4 ? '#776e65' : '#f9f6f2';
        ctx.font = val < 100 ? 'bold 32px monospace' : val < 1000 ? 'bold 26px monospace' : 'bold 20px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(val, px+45, py+45);
      }
    }
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(238,228,218,0.7)';
    ctx.fillRect(0,0,440,500);
    ctx.fillStyle = '#776e65';
    ctx.font = 'bold 40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over!', 220, 220);
    ctx.font = '20px monospace';
    ctx.fillText('Score: '+score, 220, 270);
    ctx.fillText('SPACE to restart', 220, 310);
  }
}

function slide(row) {
  let arr = row.filter(v => v);
  for (let i=0; i<arr.length-1; i++) {
    if (arr[i] === arr[i+1]) {
      arr[i] *= 2;
      score += arr[i];
      if (score > best) { best = score; localStorage.setItem('2048best', best); }
      arr.splice(i+1, 1);
    }
  }
  while (arr.length < grid) arr.push(0);
  return arr;
}

function move(dir) {
  if (state !== 'play') return;
  let moved = false;
  const old = board.map(r => [...r]);
  if (dir === 'left') {
    for (let y=0; y<grid; y++) board[y] = slide(board[y]);
  } else if (dir === 'right') {
    for (let y=0; y<grid; y++) board[y] = slide(board[y].slice().reverse()).reverse();
  } else if (dir === 'up') {
    for (let x=0; x<grid; x++) {
      let col = board.map(r => r[x]);
      const nc = slide(col);
      for (let y=0; y<grid; y++) board[y][x] = nc[y];
    }
  } else if (dir === 'down') {
    for (let x=0; x<grid; x++) {
      let col = board.map(r => r[x]);
      const nc = slide(col.slice().reverse()).reverse();
      for (let y=0; y<grid; y++) board[y][x] = nc[y];
    }
  }
  moved = board.some((r,y) => r.some((v,x) => v !== old[y][x]));
  if (moved) {
    addTile();
    if (!canMove()) state = 'over';
  }
  draw();
}

function canMove() {
  for (let y=0; y<grid; y++) for (let x=0; x<grid; x++) {
    if (!board[y][x]) return true;
    if (x < grid-1 && board[y][x] === board[y][x+1]) return true;
    if (y < grid-1 && board[y][x] === board[y+1][x]) return true;
  }
  return false;
}

document.addEventListener('keydown', e => {
  if (state === 'over' && e.code === 'Space') { init(); draw(); return; }
  if (e.key === 'ArrowLeft') move('left');
  if (e.key === 'ArrowRight') move('right');
  if (e.key === 'ArrowUp') move('up');
  if (e.key === 'ArrowDown') move('down');
});

init();
draw();
</script>
</body>
</html>
